<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="{{ page.description | default: site.description | escape }}">
<title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#121a2b;--line:#263249;--text:#edf2ff;--muted:#a7b3ca;--accent:#69e0c2}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(ellipse at top right,#162b3d 0,transparent 38%),var(--bg);color:var(--text);line-height:1.75}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}.wrap{width:min(1000px,calc(100% - 36px));margin:auto}
header{border-bottom:1px solid var(--line);padding:20px 0}.nav{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}.brand{font-weight:800;letter-spacing:.04em;color:var(--text)}nav{display:flex;gap:18px;flex-wrap:wrap;font-size:.94rem}
main{min-height:70vh;padding:48px 0 72px}.eyebrow{color:var(--accent);text-transform:uppercase;letter-spacing:.15em;font-size:.78rem;font-weight:800}
h1{font-size:clamp(2.2rem,6vw,4rem);line-height:1.1;letter-spacing:-.04em;margin:.55em 0}h2{margin-top:1.7em;line-height:1.25}h3{margin-top:1.4em}p,li{color:#d4dced}strong{color:var(--text)}code{background:#182237;padding:.15em .35em;border-radius:5px}
.panel{background:rgba(18,26,43,.85);border:1px solid var(--line);border-radius:16px;padding:clamp(20px,4vw,36px)}.btn{display:inline-block;padding:10px 15px;border:1px solid var(--line);border-radius:9px;font-weight:700;margin:8px 8px 0 0}.primary{background:var(--accent);color:#07131a;border-color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.card{display:block;border:1px solid var(--line);border-radius:14px;padding:20px;background:rgba(18,26,43,.72)}.card h3{margin:0 0 7px;color:var(--text)}.muted,.card p{color:var(--muted)}
footer{border-top:1px solid var(--line);padding:24px 0 32px;color:var(--muted);font-size:.9rem}@media(max-width:650px){.grid{grid-template-columns:1fr}main{padding-top:32px}}
</style></head><body>
<header><div class="wrap nav"><a class="brand" href="{{ '/' | relative_url }}">MADHAVAN V / SECURITY</a><nav>
<a href="{{ '/' | relative_url }}">Home</a><a href="{{ '/about/' | relative_url }}">About</a><a href="{{ '/blog/' | relative_url }}">Blog</a>
<a href="https://www.linkedin.com/in/madhavan77777/" target="_blank" rel="noopener noreferrer">LinkedIn ↗</a>
<a href="https://github.com/madhavanrayzz/cybersecurity-portfolio" target="_blank" rel="noopener noreferrer">GitHub ↗</a>
</nav></div></header>
<main><div class="wrap">{% if page.eyebrow %}<div class="eyebrow">{{ page.eyebrow }}</div>{% endif %}<article class="panel">{{ content }}</article></div></main>
<footer><div class="wrap">© {{ site.time | date: "%Y" }} Madhavan V · Responsible disclosure first.</div></footer></body></html>
